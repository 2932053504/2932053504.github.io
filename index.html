<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🦷 口腔专业系统</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:#f1f5f9; height:100vh; display:flex; color:#0f172a; }

.sidebar { width:260px; background:#fff; border-right:1px solid #e2e8f0; padding:24px 16px; display:flex; flex-direction:column; overflow-y:auto; flex-shrink:0; }
.sidebar .logo { font-size:1.5rem; font-weight:700; margin-bottom:2px; cursor:pointer; display:flex; align-items:center; gap:6px; }
.sidebar .logo:hover { opacity:.7; }
.sidebar .logo .edit-icon { font-size:.8rem; color:#94a3b8; }
.sidebar .sub { font-size:.8rem; color:#64748b; margin-bottom:24px; }

.stat-box { background:#f8fafc; border-radius:12px; padding:14px; margin-bottom:20px; display:grid; grid-template-columns:1fr 1fr 1fr; gap:4px; }
.stat-box div { text-align:center; }
.stat-box .num { font-weight:700; font-size:1.2rem; color:#0f172a; }
.stat-box .label { font-size:.6rem; color:#64748b; text-transform:uppercase; }

.sidebar h4 { font-size:.75rem; text-transform:uppercase; color:#94a3b8; letter-spacing:.5px; margin:16px 0 8px 0; }
.category-header { display:flex; justify-content:space-between; align-items:center; margin:16px 0 8px 0; }
.category-header h4 { margin:0; }
.category-header .add-cat-btn { background:none; border:1px solid #e2e8f0; border-radius:40px; padding:0 10px; font-size:.8rem; cursor:pointer; color:#3b82f6; line-height:1.8; }
.category-header .add-cat-btn:hover { background:#eff6ff; border-color:#3b82f6; }

.category-list { list-style:none; margin-bottom:12px; min-height:40px; }
.category-list li { display:flex; justify-content:space-between; align-items:center; padding:6px 10px; border-radius:8px; cursor:grab; font-size:.9rem; transition:.15s; user-select:none; border:1px solid transparent; }
.category-list li:active { cursor:grabbing; }
.category-list li.dragging { opacity:.5; border:1px dashed #3b82f6; }
.category-list li.drag-over { border-color:#3b82f6; background:#dbeafe; }
.category-list li:hover { background:#f1f5f9; }
.category-list li.active { background:#dbeafe; color:#1d4ed8; font-weight:600; }
.category-list li .count { color:#94a3b8; font-weight:400; font-size:.8rem; }
.category-list li .action-btns { display:flex; gap:4px; align-items:center; }
.category-list li .action-btns button { background:none; border:none; font-size:.9rem; cursor:pointer; padding:0 4px; color:#94a3b8; line-height:1; }
.category-list li .action-btns button:hover { color:#3b82f6; transform:scale(1.2); }
.category-list li .action-btns .case-btn:hover { color:#8b5cf6; }

.diff-entry { background:#fef3c7; border:1px solid #fcd34d; border-radius:10px; padding:10px 12px; cursor:pointer; font-size:.9rem; font-weight:600; color:#92400e; transition:.15s; margin-bottom:8px; display:flex; align-items:center; gap:8px; }
.diff-entry:hover { background:#fde68a; }
.diff-entry.active { background:#f59e0b; color:#fff; border-color:#f59e0b; }

.tag-cloud { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
.tag-cloud .tag-item { background:#eef2ff; color:#4338ca; padding:2px 12px; border-radius:20px; font-size:.75rem; cursor:pointer; border:1px solid transparent; }
.tag-cloud .tag-item:hover { background:#c7d2fe; }
.tag-cloud .tag-item.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }

.backup-area { margin-top:auto; padding-top:16px; border-top:1px solid #e2e8f0; display:flex; flex-direction:column; gap:6px; }
.backup-area button { width:100%; padding:8px 0; background:#fff; border:1px solid #e2e8f0; border-radius:8px; font-size:.8rem; cursor:pointer; font-weight:500; }
.backup-area button:hover { background:#f1f5f9; border-color:#94a3b8; }
.backup-area button.primary { background:#10b981; color:#fff; border-color:#10b981; font-weight:600; }
.backup-area button.primary:hover { background:#059669; }
.backup-area .save-status { font-size:.65rem; color:#64748b; text-align:center; margin-top:2px; min-height:1em; }
#fileInput { display:none; }

.main { flex:1; padding:24px 32px; overflow-y:auto; display:flex; flex-direction:column; }

.top-bar { display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; margin-bottom:16px; gap:12px; }
.top-bar .search-wrap { flex:1; min-width:200px; position:relative; }
.top-bar .search-wrap input { width:100%; padding:10px 16px 10px 40px; border:1px solid #e2e8f0; border-radius:40px; font-size:.95rem; background:#fff; }
.top-bar .search-wrap input:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.2); }
.top-bar .search-wrap .icon { position:absolute; left:14px; top:50%; transform:translateY(-50%); color:#94a3b8; }

.btn-primary { background:#3b82f6; color:#fff; border:none; padding:10px 24px; border-radius:40px; font-weight:600; font-size:.9rem; cursor:pointer; white-space:nowrap; }
.btn-primary:hover { background:#2563eb; }
.btn-case { background:#8b5cf6; color:#fff; border:none; padding:10px 24px; border-radius:40px; font-weight:600; font-size:.9rem; cursor:pointer; white-space:nowrap; }
.btn-case:hover { background:#7c3aed; }
.btn-diff { background:#f59e0b; color:#fff; border:none; padding:10px 24px; border-radius:40px; font-weight:600; font-size:.9rem; cursor:pointer; white-space:nowrap; }
.btn-diff:hover { background:#d97706; }

.category-detail-header { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; border-bottom:2px solid #e2e8f0; padding-bottom:16px; }
.category-detail-header .top-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
.category-detail-header .top-row .back-btn { background:none; border:1px solid #e2e8f0; border-radius:40px; padding:4px 16px; cursor:pointer; font-size:.9rem; }
.category-detail-header .top-row .back-btn:hover { background:#f1f5f9; }
.category-detail-header .top-row .cat-title { font-size:1.5rem; font-weight:700; }
.category-detail-header .top-row .cat-count { color:#64748b; font-size:.9rem; }
.category-detail-header .sub-tabs { display:flex; gap:8px; flex-wrap:wrap; }
.category-detail-header .sub-tabs .tab-btn { padding:6px 20px; border-radius:40px; border:1px solid #e2e8f0; background:#fff; cursor:pointer; font-weight:500; }
.category-detail-header .sub-tabs .tab-btn.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }
.category-detail-header .sub-tabs .tab-btn:hover:not(.active) { background:#f1f5f9; }

.grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:20px; flex:1; min-height:200px; }
.card { background:#fff; border-radius:16px; padding:18px; box-shadow:0 1px 3px rgba(0,0,0,.04); border:1px solid #e2e8f0; transition:.2s; cursor:grab; display:flex; flex-direction:column; user-select:none; }
.card:active { cursor:grabbing; }
.card.dragging { opacity:.4; border:1px dashed #3b82f6; }
.card.drag-over { border-color:#3b82f6; background:#f0f9ff; }
.card:hover { transform:translateY(-4px); box-shadow:0 12px 30px rgba(0,0,0,.08); border-color:#b9d0f0; }
.card .card-type { font-size:.65rem; font-weight:700; padding:2px 10px; border-radius:40px; align-self:flex-start; margin-bottom:6px; }
.card .card-type.knowledge { background:#dbeafe; color:#1d4ed8; }
.card .card-type.case { background:#ede9fe; color:#7c3aed; }
.card .card-type.comparison { background:#fef3c7; color:#92400e; }
.card .card-cat { font-size:.7rem; font-weight:600; color:#3b82f6; background:#eff6ff; padding:2px 12px; border-radius:40px; display:inline-block; align-self:flex-start; margin-bottom:6px; }
.card h3 { font-size:1.1rem; margin-bottom:6px; }
.card .card-summary { color:#475569; font-size:.9rem; line-height:1.5; flex:1; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.card .card-tags { margin-top:12px; display:flex; flex-wrap:wrap; gap:4px; }
.card .card-tags span { background:#f1f5f9; color:#334155; font-size:.65rem; padding:2px 10px; border-radius:40px; }
.card .card-footer { margin-top:12px; font-size:.7rem; color:#94a3b8; border-top:1px solid #f1f5f9; padding-top:10px; display:flex; justify-content:space-between; }
.no-result { grid-column:1/-1; text-align:center; padding:80px 20px; color:#94a3b8; }

.diff-table-wrap { overflow-x:auto; margin-top:16px; }
.diff-table { width:100%; border-collapse:collapse; font-size:.9rem; }
.diff-table th, .diff-table td { border:1px solid #e2e8f0; padding:10px 14px; text-align:left; vertical-align:top; }
.diff-table th { background:#f8fafc; font-weight:700; color:#0f172a; white-space:nowrap; }
.diff-table td:first-child { background:#f8fafc; font-weight:600; white-space:nowrap; }
.diff-table tr:hover td { background:#f0f9ff; }

.modal-overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,.4); backdrop-filter:blur(4px); justify-content:center; align-items:center; z-index:999; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; max-width:800px; width:100%; border-radius:24px; padding:32px; max-height:92vh; overflow-y:auto; box-shadow:0 30px 60px rgba(0,0,0,.2); }
.modal h2 { margin-bottom:20px; }
.modal label { display:block; font-weight:600; font-size:.85rem; margin-top:16px; margin-bottom:4px; }
.modal input, .modal select { width:100%; padding:10px 14px; border:1px solid #e2e8f0; border-radius:12px; font-size:.95rem; font-family:inherit; background:#fff; }
.modal textarea {
  width:100%; padding:10px 14px; border:1px solid #e2e8f0; border-radius:12px;
  font-size:.95rem; font-family:inherit; background:#fff;
  min-height:80px; resize:vertical; overflow-y:hidden;
  transition:height .1s;
}
.modal input:focus, .modal textarea:focus, .modal select:focus { outline:none; border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.15); }
.modal .image-upload-area { display:flex; flex-wrap:wrap; gap:10px; margin-top:6px; align-items:center; }
.modal .image-upload-area .preview-img { width:60px; height:60px; object-fit:cover; border-radius:8px; border:1px solid #e2e8f0; }
.modal .image-upload-area .file-input-label { background:#f1f5f9; padding:6px 16px; border-radius:30px; font-size:.8rem; cursor:pointer; }
.modal .image-upload-area .file-input-label:hover { background:#e2e8f0; }
.modal .image-upload-area input[type="file"] { display:none; }
.modal .extra-fields-area { margin-top:12px; padding:12px; background:#f8fafc; border-radius:12px; }
.modal .extra-fields-area .extra-item { display:flex; gap:8px; margin-bottom:6px; align-items:center; }
.modal .extra-fields-area .extra-item input { flex:1; padding:6px 10px; border:1px solid #e2e8f0; border-radius:8px; font-size:.85rem; }
.modal .btn-group { display:flex; gap:12px; justify-content:flex-end; margin-top:28px; }
.modal .btn-group button { padding:10px 28px; border-radius:40px; border:none; font-weight:600; cursor:pointer; }
.modal .btn-cancel { background:#e2e8f0; color:#334155; }
.modal .btn-save { background:#3b82f6; color:#fff; }
.modal .btn-save:hover { background:#2563eb; }

.diff-diseases-area, .diff-dimensions-area { margin-top:12px; padding:12px; background:#f8fafc; border-radius:12px; }
.diff-disease-row, .diff-dimension-row { display:flex; gap:8px; margin-bottom:8px; align-items:center; flex-wrap:wrap; }
.diff-disease-row input { flex:1; padding:8px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:.9rem; min-width:120px; }
.diff-dimension-row .dim-name { flex:0 0 140px; padding:8px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:.9rem; font-weight:600; }
.diff-dimension-row .dim-value { flex:1; padding:8px 12px; border:1px solid #e2e8f0; border-radius:8px; font-size:.9rem; min-width:120px; }
.remove-row-btn { background:none; border:none; color:#ef4444; font-weight:700; cursor:pointer; font-size:1rem; padding:0 6px; }
.add-row-btn { background:#f1f5f9; border:1px dashed #94a3b8; border-radius:30px; padding:6px 16px; margin-top:6px; cursor:pointer; font-size:.85rem; }
.add-row-btn:hover { background:#e2e8f0; }

.detail-overlay { display:none; position:fixed; inset:0; background:rgba(15,23,42,.5); backdrop-filter:blur(4px); justify-content:center; align-items:center; z-index:1000; padding:30px; }
.detail-overlay.show { display:flex; }
.detail-box { background:#fff; max-width:900px; width:100%; border-radius:24px; padding:32px; max-height:90vh; overflow-y:auto; box-shadow:0 30px 60px rgba(0,0,0,.3); }
.detail-box .close-detail { float:right; background:none; border:none; font-size:1.8rem; cursor:pointer; color:#94a3b8; }
.detail-box .detail-type { display:inline-block; font-size:.7rem; font-weight:700; padding:2px 14px; border-radius:40px; margin-bottom:8px; }
.detail-box .detail-type.knowledge { background:#dbeafe; color:#1d4ed8; }
.detail-box .detail-type.case { background:#ede9fe; color:#7c3aed; }
.detail-box .detail-type.comparison { background:#fef3c7; color:#92400e; }
.detail-box .detail-cat { color:#3b82f6; font-weight:600; font-size:.8rem; }
.detail-box h2 { margin:6px 0 12px 0; }
.detail-box .detail-body { margin-top:12px; line-height:1.8; color:#1e293b; white-space:pre-wrap; }
.detail-box .detail-body img { max-width:100%; border-radius:12px; margin:10px 0; border:1px solid #e2e8f0; }
.detail-box .detail-case-module { margin-top:16px; padding:12px; background:#f8fafc; border-radius:12px; }
.detail-box .detail-case-module .module-label { font-weight:700; margin-bottom:4px; }
.detail-box .detail-case-module .module-content { white-space:pre-wrap; font-size:.95rem; }
.detail-box .detail-extra { margin-top:12px; display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.detail-box .detail-extra .extra-item { background:#f1f5f9; padding:8px 12px; border-radius:8px; }
.detail-box .detail-extra .extra-item .extra-key { font-weight:600; font-size:.8rem; color:#475569; }
.detail-box .detail-tags { margin-top:16px; display:flex; flex-wrap:wrap; gap:6px; }
.detail-box .detail-tags span { background:#f1f5f9; padding:2px 14px; border-radius:40px; font-size:.8rem; }
.detail-box .detail-delete { background:#fee2e2; color:#dc2626; border:none; padding:8px 20px; border-radius:40px; font-weight:600; cursor:pointer; margin-top:16px; }

@media (max-width:768px) {
  .sidebar { display:none; }
  .main { padding:16px; }
  .top-bar { flex-direction:column; align-items:stretch; }
}
</style>
</head>
<body>

<aside class="sidebar">
  <div class="logo" id="logoTitle">🦷 <span>DentalKB</span> <span class="edit-icon">✎</span></div>
  <div class="sub">口腔知识库 + 病例 + 鉴别诊断</div>

  <div class="stat-box">
    <div><div class="num" id="totalCount">0</div><div class="label">总条目</div></div>
    <div><div class="num" id="caseCount">0</div><div class="label">病例</div></div>
    <div><div class="num" id="diffCount">0</div><div class="label">对比组</div></div>
  </div>

  <div class="category-header">
    <h4>📂 分类</h4>
    <button class="add-cat-btn" id="addCategoryBtn">＋ 新增</button>
  </div>
  <ul class="category-list" id="categoryList">
    <li data-cat="all" class="active">全部 <span class="count" id="allCount">0</span></li>
  </ul>

  <h4>🔬 鉴别诊断</h4>
  <div class="diff-entry" id="diffEntry">📊 进入鉴别诊断对比</div>

  <h4>🏷️ 热门标签</h4>
  <div class="tag-cloud" id="tagCloud"></div>

  <div class="backup-area">
    <button class="primary" id="saveToFileBtn">💾 保存到文件（自动同步）</button>
    <button id="exportBtn">📤 导出备份</button>
    <button id="importBtn">📥 导入备份</button>
    <div class="save-status" id="saveStatus">未选择保存文件</div>
    <input type="file" id="fileInput" accept=".json" />
  </div>
</aside>

<main class="main" id="mainContent">
  <div id="viewContainer"></div>
</main>

<!-- 知识点 -->
<div class="modal-overlay" id="formModal">
  <div class="modal">
    <h2 id="formTitle">📝 新增知识点</h2>
    <label>标题 *</label>
    <input type="text" id="inputTitle" placeholder="如：可复性牙髓炎" />
    <label>分类 *</label>
    <input type="text" id="inputCategory" placeholder="如：牙体牙髓学" list="catSuggest" />
    <datalist id="catSuggest"></datalist>
    <label>标签（用英文逗号分割）</label>
    <input type="text" id="inputTags" placeholder="标签1, 标签2" />
    <label>定义</label>
    <input type="text" id="inputSummary" placeholder="简要定义" />
    <label>详细内容（支持 Markdown）</label>
    <textarea id="inputDetail" rows="4" placeholder="病因：...&#10;治疗：..."></textarea>
    <label>图片</label>
    <div class="image-upload-area">
      <label class="file-input-label" for="imageFileInput">📎 选择图片</label>
      <input type="file" id="imageFileInput" accept="image/*" multiple />
      <div id="imagePreviewContainer" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;"></div>
    </div>
    <div class="btn-group">
      <button class="btn-cancel" id="closeFormBtn">取消</button>
      <button class="btn-save" id="saveEntryBtn">保存</button>
    </div>
  </div>
</div>

<!-- 病例 -->
<div class="modal-overlay" id="caseModal">
  <div class="modal">
    <h2 id="caseFormTitle">📋 新增真实病例</h2>
    <label>标题 *</label>
    <input type="text" id="caseTitle" placeholder="病例标题" />
    <label>分类 *</label>
    <input type="text" id="caseCategory" placeholder="如：牙体牙髓学" list="catSuggest2" />
    <datalist id="catSuggest2"></datalist>
    <label>标签（用英文逗号分割）</label>
    <input type="text" id="caseTags" placeholder="典型病例, 根管治疗" />
    <label>① 主诉呈现</label>
    <textarea id="caseChiefComplaint" rows="2" placeholder="患者主诉"></textarea>
    <label>② 问诊发现</label>
    <textarea id="caseInquiry" rows="3" placeholder="问诊内容"></textarea>
    <label>③ 检查结果</label>
    <textarea id="caseExamination" rows="3" placeholder="检查结果"></textarea>
    <label>④ 诊断思考</label>
    <textarea id="caseDiagnosisThinking" rows="3" placeholder="诊断思路"></textarea>
    <label>⑤ 参考答案</label>
    <textarea id="caseReferenceAnswer" rows="3" placeholder="参考答案"></textarea>
    <label>⑥ 图片呈现</label>
    <div class="image-upload-area">
      <label class="file-input-label" for="caseImageInput">📎 选择图片</label>
      <input type="file" id="caseImageInput" accept="image/*" multiple />
      <div id="caseImagePreview" style="display:flex;flex-wrap:wrap;gap:8px;margin-top:6px;"></div>
    </div>
    <label style="margin-top:12px;">📌 额外字段</label>
    <div class="extra-fields-area" id="extraFieldsContainer"></div>
    <button type="button" id="addExtraFieldBtn" class="add-row-btn">➕ 添加额外字段</button>
    <div class="btn-group">
      <button class="btn-cancel" id="closeCaseBtn">取消</button>
      <button class="btn-save" id="saveCaseBtn">保存病例</button>
    </div>
  </div>
</div>

<!-- 鉴别诊断 -->
<div class="modal-overlay" id="diffModal">
  <div class="modal" style="max-width:900px;">
    <h2 id="diffFormTitle">🔬 新增鉴别诊断对比组</h2>
    <label>对比组标题 *</label>
    <input type="text" id="diffTitle" placeholder="如：急性牙髓炎 vs 急性根尖周炎" />
    <label>分类 *</label>
    <input type="text" id="diffCategory" placeholder="如：牙体牙髓学" list="catSuggest3" />
    <datalist id="catSuggest3"></datalist>
    <label>标签（用英文逗号分割）</label>
    <input type="text" id="diffTags" placeholder="鉴别诊断, 疼痛" />
    <label>快速模板（选一个自动填维度）</label>
    <select id="diffTemplate">
      <option value="none">— 不选择 —</option>
      <option value="pulp">🦷 牙髓/根尖病（疼痛性质、定位、冷热刺激、叩诊、牙髓活力、X线）</option>
      <option value="perio">🩸 牙周病（牙龈出血、牙周袋深度、附着丧失、牙槽骨吸收、松动度）</option>
      <option value="mucosa">👄 口腔黏膜病（好发部位、形态、颜色、疼痛、癌变风险）</option>
      <option value="infection">🔥 颌面部感染（红肿热痛、张口度、发热、白细胞、X线/CT）</option>
    </select>
    <label>临床要点/备注</label>
    <textarea id="diffNotes" rows="2" placeholder="总结鉴别关键点..."></textarea>

    <label style="margin-top:16px;">参与对比的疾病（至少2个）</label>
    <div class="diff-diseases-area" id="diffDiseasesArea"></div>
    <button type="button" id="addDiseaseBtn" class="add-row-btn">➕ 添加疾病</button>

    <label style="margin-top:16px;">对比维度</label>

<script>
/* ============================================================
   1. IndexedDB
============================================================ */
const DB_NAME='DentalKB', STORE_NAME='entries';
let db=null;

function openDB(){
  return new Promise((resolve,reject)=>{
    const req=indexedDB.open(DB_NAME,1);
    req.onupgradeneeded=e=>{
      const d=e.target.result;
      if(!d.objectStoreNames.contains(STORE_NAME)){
        const s=d.createObjectStore(STORE_NAME,{keyPath:'id'});
        s.createIndex('category','category',{unique:false});
        s.createIndex('tags','tags',{unique:false,multiEntry:true});
        s.createIndex('type','type',{unique:false});
      }
    };
    req.onsuccess=e=>resolve(e.target.result);
    req.onerror=e=>reject(e.target.error);
  });
}
function dbAdd(e){return new Promise((res,rej)=>{const t=db.transaction(STORE_NAME,'readwrite');const s=t.objectStore(STORE_NAME);const r=s.add(e);r.onsuccess=()=>res(e);r.onerror=()=>rej(r.error);});}
function dbUpdate(e){return new Promise((res,rej)=>{const t=db.transaction(STORE_NAME,'readwrite');const s=t.objectStore(STORE_NAME);const r=s.put(e);r.onsuccess=()=>res(e);r.onerror=()=>rej(r.error);});}
function dbDelete(id){return new Promise((res,rej)=>{const t=db.transaction(STORE_NAME,'readwrite');const s=t.objectStore(STORE_NAME);const r=s.delete(id);r.onsuccess=()=>res();r.onerror=()=>rej(r.error);});}
function dbGetAll(){return new Promise((res,rej)=>{const t=db.transaction(STORE_NAME,'readonly');const s=t.objectStore(STORE_NAME);const r=s.getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
function dbGetById(id){return new Promise((res,rej)=>{const t=db.transaction(STORE_NAME,'readonly');const s=t.objectStore(STORE_NAME);const r=s.get(id);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}

/* ============================================================
   2. 文件保存（File System Access API + 降级下载）
============================================================ */
let fileHandle=null;
let autoSaveTimer=null;

function updateSaveStatus(msg,ok){
  const el=document.getElementById('saveStatus');
  if(!el)return;
  el.textContent=msg;
  el.style.color=ok?'#10b981':'#64748b';
}

async function pickAndSaveFile(){
  if(!window.showSaveFilePicker){
    updateSaveStatus('浏览器不支持自动保存，已使用下载方式');
    downloadBackup();
    return;
  }
  try{
    fileHandle=await window.showSaveFilePicker({
      suggestedName:`dental_kb_${new Date().toISOString().slice(0,10)}.json`,
      types:[{description:'JSON 备份',accept:{'application/json':['.json']}}]
    });
    await writeToFile(true);
  }catch(e){
    if(e.name!=='AbortError')console.error(e);
  }
}

async function writeToFile(manual){
  if(!fileHandle){
    if(manual)downloadBackup();
    return;
  }
  try{
    const data=await dbGetAll();
    const text=JSON.stringify(data,null,2);
    const writable=await fileHandle.createWritable();
    await writable.write(text);
    await writable.close();
    updateSaveStatus('✅ 已保存 · '+new Date().toLocaleTimeString(),true);
  }catch(e){
    console.error('写文件失败',e);
    fileHandle=null;
    updateSaveStatus('❌ 文件句柄失效，请重新点击保存',false);
  }
}

function scheduleAutoSave(){
  if(!fileHandle)return;
  clearTimeout(autoSaveTimer);
  autoSaveTimer=setTimeout(()=>writeToFile(false),1500);
}

function downloadBackup(){
  dbGetAll().then(data=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=`dental_kb_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    updateSaveStatus('已下载备份文件',true);
  });
}

document.getElementById('saveToFileBtn').addEventListener('click',pickAndSaveFile);

function autoResizeAll(scope){

});

/* ============================================================
   4. 分类管理 + 排序
============================================================ */
const CUSTOM_CATEGORIES_KEY='dental_custom_categories';
const CATEGORY_ORDER_KEY='dental_category_order';

function loadCustomCategories(){const s=localStorage.getItem(CUSTOM_CATEGORIES_KEY);if(s){try{return JSON.parse(s);}catch(e){return[];}}return[];}
function saveCustomCategories(c){localStorage.setItem(CUSTOM_CATEGORIES_KEY,JSON.stringify(c));}
function loadCategoryOrder(){const s=localStorage.getItem(CATEGORY_ORDER_KEY);if(s){try{return JSON.parse(s);}catch(e){return[];}}return[];}
function saveCategoryOrder(o){localStorage.setItem(CATEGORY_ORDER_KEY,JSON.stringify(o));}

function getAllCategories(entries){
  const fromEntries=new Set();
  entries.forEach(e=>{if(e.category)fromEntries.add(e.category);});
  const custom=loadCustomCategories();
  const all=new Set([...fromEntries,...custom]);
  return Array.from(all).sort();
}
function getSortedCategories(entries){
  const all=getAllCategories(entries);
  const order=loadCategoryOrder();
  const orderSet=new Set(order);
  const sorted=[];
  order.forEach(c=>{if(all.includes(c))sorted.push(c);});
  const rest=all.filter(c=>!orderSet.has(c)).sort();
  rest.forEach(c=>sorted.push(c));
  return sorted;
}

function getCardOrderKey(viewMode,category){
  if(viewMode==='all')return 'dental_card_order_all';
  if(viewMode==='category')return `dental_card_order_cat_${category}`;
  return null;
}
function loadCardOrder(key){const s=localStorage.getItem(key);if(s){try{return JSON.parse(s);}catch(e){return[];}}return[];}
function saveCardOrder(key,order){localStorage.setItem(key,JSON.stringify(order));}
function sortCardsByOrder(cards,orderKey){
  const order=loadCardOrder(orderKey);
  if(order.length===0)return cards;
  const map={};cards.forEach(c=>{map[c.id]=c;});
  const result=[];
  order.forEach(id=>{if(map[id]){result.push(map[id]);delete map[id];}});
  Object.values(map).forEach(c=>result.push(c));
  return result;
}

   7. 渲染主函数
============================================================ */
function render(){
  updateSidebar();
  if(viewMode==='all')renderAllView();
  else if(viewMode==='category')renderCategoryView();
  else if(viewMode==='differential')renderDifferentialView();
}

function updateSidebar(){
  totalCount.textContent=allEntries.length;
  caseCount.textContent=allEntries.filter(e=>e.type==='case').length;
  diffCount.textContent=allEntries.filter(e=>e.type==='comparison').length;

  const sortedCats=getSortedCategories(allEntries);
  const catMap={};
  allEntries.forEach(e=>{catMap[e.category]=(catMap[e.category]||0)+1;});
  const custom=loadCustomCategories();
  custom.forEach(c=>{if(!(c in catMap))catMap[c]=0;});

  let html=`<li data-cat="all" class="${viewMode==='all'&&currentFilterCat==='all'?'active':''}" draggable="false">全部 <span class="count">${allEntries.length}</span></li>`;
  sortedCats.forEach(c=>{
    const active=(viewMode==='category'&&currentFilterCat===c)?'active':'';
    html+=`<li data-cat="${c}" class="${active}" draggable="true">${c} <span class="count">${catMap[c]||0}</span>
      <span class="action-btns">
        <button class="kb-btn" data-cat="${c}" title="新增知识点">＋</button>
        <button class="case-btn" data-cat="${c}" title="新增病例">📋</button>
      </span></li>`;
  });
  categoryList.innerHTML=html;

  setupCategoryDragDrop();

  document.querySelectorAll('.kb-btn').forEach(b=>b.addEventListener('click',function(e){e.stopPropagation();openAddForm(this.dataset.cat);}));
  document.querySelectorAll('.case-btn').forEach(b=>b.addEventListener('click',function(e){e.stopPropagation();openCaseForm(this.dataset.cat);}));

  const tagMap={};
  allEntries.forEach(e=>{if(e.tags)e.tags.forEach(t=>{tagMap[t]=(tagMap[t]||0)+1;});});
  let tagHtml='';
  Object.keys(tagMap).sort((a,b)=>tagMap[b]-tagMap[a]).slice(0,15).forEach(t=>{
    const active=(currentFilterTag===t&&viewMode==='all')?'active':'';
    tagHtml+=`<span class="tag-item ${active}" data-tag="${t}">${t} (${tagMap[t]})</span>`;
  });
  tagCloud.innerHTML=tagHtml||'<span style="font-size:.8rem;color:#94a3b8;">暂无标签</span>';

  const catOptions=sortedCats;
  document.getElementById('catSuggest').innerHTML=catOptions.map(c=>`<option value="${c}">`).join('');
  document.getElementById('catSuggest2').innerHTML=catOptions.map(c=>`<option value="${c}">`).join('');
  document.getElementById('catSuggest3').innerHTML=catOptions.map(c=>`<option value="${c}">`).join('');

  if(viewMode==='differential')diffEntry.classList.add('active');
  else diffEntry.classList.remove('active');
}

function setupCategoryDragDrop(){
  const items=categoryList.querySelectorAll('li[data-cat]');
  let dragItem=null;
  items.forEach(item=>{
    item.addEventListener('dragstart',function(e){
      if(this.dataset.cat==='all'){e.preventDefault();return;}
      dragItem=this;this.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',this.dataset.cat);
    });
    item.addEventListener('dragend',function(){this.classList.remove('dragging');document.querySelectorAll('.category-list li').forEach(li=>li.classList.remove('drag-over'));});
    item.addEventListener('dragover',function(e){e.preventDefault();if(!dragItem||dragItem===this)return;this.classList.add('drag-over');});
    item.addEventListener('dragleave',function(){this.classList.remove('drag-over');});
    item.addEventListener('drop',function(e){
      e.preventDefault();this.classList.remove('drag-over');
      if(!dragItem||dragItem===this)return;
      const from=dragItem.dataset.cat,to=this.dataset.cat;
      if(from==='all'||to==='all')return;
      const order=loadCategoryOrder();
      let newOrder=order.filter(c=>c!==from);
      const idx=newOrder.indexOf(to);
      if(idx===-1)newOrder.push(from);
      else newOrder.splice(idx,0,from);
      saveCategoryOrder(newOrder);
      render();
    });
  });
}

function renderAllView(){
  const keyword=document.getElementById('searchInput')?document.getElementById('searchInput').value.trim().toLowerCase():'';
  let filtered=allEntries;
  if(currentFilterCat!=='all')filtered=filtered.filter(e=>e.category===currentFilterCat);
  if(currentFilterTag)filtered=filtered.filter(e=>e.tags&&e.tags.includes(currentFilterTag));
  if(keyword){
    filtered=filtered.filter(e=>
      e.title.toLowerCase().includes(keyword)||
      (e.summary&&e.summary.toLowerCase().includes(keyword))||
      (e.detail&&e.detail.toLowerCase().includes(keyword))||
      (e.tags&&e.tags.some(t=>t.toLowerCase().includes(keyword)))||
      (e.type==='case'&&e.caseData&&(
        (e.caseData.chiefComplaint||'').toLowerCase().includes(keyword)||
        (e.caseData.inquiry||'').toLowerCase().includes(keyword)||
        (e.caseData.examination||'').toLowerCase().includes(keyword)||
        (e.caseData.diagnosisThinking||'').toLowerCase().includes(keyword)||
        (e.caseData.referenceAnswer||'').toLowerCase().includes(keyword)
      ))||
      (e.type==='comparison'&&e.diseases&&e.diseases.some(d=>d.toLowerCase().includes(keyword)))
    );
  }
  const orderKey=getCardOrderKey('all',null);
  filtered=sortCardsByOrder(filtered,orderKey);

  viewContainer.innerHTML=`
    <div class="top-bar">
      <div class="search-wrap"><span class="icon">🔍</span><input type="text" id="searchInput" placeholder="搜索标题、标签、主诉、疾病..." value="${keyword}" /></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap;">
        <button class="btn-primary" id="openAddBtn">+ 知识点</button>
        <button class="btn-case" id="openCaseBtn">📋 病例</button>
        <button class="btn-diff" id="openDiffBtn">🔬 鉴别诊断</button>
      </div>
    </div>
    <div class="grid" id="cardGrid"></div>
  `;

  document.getElementById('searchInput').addEventListener('input',render);
  document.getElementById('openAddBtn').addEventListener('click',()=>openAddForm(''));
  document.getElementById('openCaseBtn').addEventListener('click',()=>openCaseForm(''));
  document.getElementById('openDiffBtn').addEventListener('click',()=>openDiffForm(''));

  const grid=document.getElementById('cardGrid');
  if(filtered.length===0){grid.innerHTML='<div class="no-result">😕 没有找到匹配的条目</div>';return;}
  grid.innerHTML=filtered.map(entry=>renderCard(entry)).join('');
  bindCardClicks();
  setupCardDragDrop(grid,'all',null);
  allCount.textContent=allEntries.length;
}

function renderCategoryView(){
  const cat=currentFilterCat;
  if(cat==='all'){viewMode='all';render();return;}

  let items=allEntries.filter(e=>e.category===cat);
  if(subTypeFilter==='knowledge')items=items.filter(e=>e.type==='knowledge');
  else if(subTypeFilter==='case')items=items.filter(e=>e.type==='case');
  else if(subTypeFilter==='comparison')items=items.filter(e=>e.type==='comparison');

  const orderKey=getCardOrderKey('category',cat);
  items=sortCardsByOrder(items,orderKey);

  const total=allEntries.filter(e=>e.category===cat).length;
  const kbCount=allEntries.filter(e=>e.category===cat&&e.type==='knowledge').length;
  const caseCnt=allEntries.filter(e=>e.category===cat&&e.type==='case').length;
  const diffCnt=allEntries.filter(e=>e.category===cat&&e.type==='comparison').length;

  viewContainer.innerHTML=`
    <div class="category-detail-header">
      <div class="top-row">
        <button class="back-btn" id="backToAllBtn">← 返回全部</button>
        <span class="cat-title">📂 ${cat}</span>
        <span class="cat-count">（共 ${total} 条）</span>
        <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn-primary" id="addKbInCat">+ 知识点</button>
          <button class="btn-case" id="addCaseInCat">📋 病例</button>
          <button class="btn-diff" id="addDiffInCat">🔬 鉴别</button>
        </div>
      </div>
      <div class="sub-tabs">
        <button class="tab-btn ${subTypeFilter==='all'?'active':''}" data-sub="all">全部 (${total})</button>
        <button class="tab-btn ${subTypeFilter==='knowledge'?'active':''}" data-sub="knowledge">📖 知识点 (${kbCount})</button>
        <button class="tab-btn ${subTypeFilter==='case'?'active':''}" data-sub="case">📋 病例 (${caseCnt})</button>
        <button class="tab-btn ${subTypeFilter==='comparison'?'active':''}" data-sub="comparison">🔬 鉴别 (${diffCnt})</button>
      </div>
    </div>
    <div class="grid" id="categoryCardGrid"></div>
  `;

  document.getElementById('backToAllBtn').addEventListener('click',()=>{viewMode='all';currentFilterCat='all';subTypeFilter='all';render();});
  document.getElementById('addKbInCat').addEventListener('click',()=>openAddForm(cat));
  document.getElementById('addCaseInCat').addEventListener('click',()=>openCaseForm(cat));
  document.getElementById('addDiffInCat').addEventListener('click',()=>openDiffForm(cat));
  document.querySelectorAll('.tab-btn').forEach(b=>b.addEventListener('click',function(){subTypeFilter=this.dataset.sub;render();}));

  const grid=document.getElementById('categoryCardGrid');
  if(items.length===0){grid.innerHTML='<div class="no-result">😕 该分类下暂无此类型条目</div>';return;}
  grid.innerHTML=items.map(entry=>renderCard(entry)).join('');
  bindCardClicks();
  setupCardDragDrop(grid,'category',cat);
}

function renderCard(entry){
  const isCase=entry.type==='case';
  const isDiff=entry.type==='comparison';
  let typeLabel='📖 知识点',typeClass='knowledge';
  if(isCase){typeLabel='📋 真实病例';typeClass='case';}
  if(isDiff){typeLabel='🔬 鉴别诊断';typeClass='comparison';}
  let summaryText=entry.summary||'暂无定义';
  if(isCase&&entry.caseData&&entry.caseData.chiefComplaint)summaryText='主诉：'+entry.caseData.chiefComplaint;
  if(isDiff&&entry.diseases)summaryText='对比：'+entry.diseases.join(' vs ');
  const tagHtml=entry.tags?entry.tags.map(t=>`<span>#${t}</span>`).join(''):'';
  const imgInd=(entry.images&&entry.images.length>0)?'📷 有图片':'';
  return `<div class="card" data-id="${entry.id}" draggable="true">
    <span class="card-type ${typeClass}">${typeLabel}</span>
    <span class="card-cat">${entry.category}</span>
    <h3>${entry.title}</h3>
    <div class="card-summary">${summaryText}</div>
    <div class="card-tags">${tagHtml}</div>
    <div class="card-footer">
      <span>${new Date(entry.updatedAt||entry.createdAt).toLocaleDateString()}</span>
      <span>${imgInd}</span>
    </div>
  </div>`;
}

function bindCardClicks(){
  document.querySelectorAll('.card').forEach(el=>{
    el.addEventListener('click',function(){
      if(this.classList.contains('dragging'))return;
      openDetail(this.dataset.id);
    });
  });
}

function setupCardDragDrop(grid,viewMode,category){
  let dragItem=null;
  grid.querySelectorAll('.card').forEach(card=>{
    card.addEventListener('dragstart',function(e){
      dragItem=this;this.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain',this.dataset.id);
    });
    card.addEventListener('dragend',function(){this.classList.remove('dragging');grid.querySelectorAll('.card').forEach(c=>c.classList.remove('drag-over'));});
    card.addEventListener('dragover',function(e){e.preventDefault();if(!dragItem||dragItem===this)return;this.classList.add('drag-over');});
    card.addEventListener('dragleave',function(){this.classList.remove('drag-over');});
    card.addEventListener('drop',function(e){
      e.preventDefault();this.classList.remove('drag-over');
      if(!dragItem||dragItem===this)return;
      const all=grid.querySelectorAll('.card');
      const ids=Array.from(all).map(el=>el.dataset.id);
      const from=dragItem.dataset.id,to=this.dataset.id;
      const fi=ids.indexOf(from),ti=ids.indexOf(to);
      if(fi===-1||ti===-1)return;
      ids.splice(fi,1);ids.splice(ti,0,from);
      const key=getCardOrderKey(viewMode,category);
      if(key)saveCardOrder(key,ids);
      render();
    });
  });
}

    comparisonContainer.style.display='block';
    let imgHtml='';
    if(entry.images&&entry.images.length>0)imgHtml=entry.images.map(i=>`<img src="${i}" />`).join('');
    detailBody.innerHTML=imgHtml;
    let table='<table class="diff-table"><thead><tr><th>对比维度</th>';
    (entry.diseases||[]).forEach(d=>{table+=`<th>${d}</th>`;});
    table+='</tr></thead><tbody>';

      table+=`<tr><td>${dim.name}</td>`;
      (dim.values||[]).forEach(v=>{table+=`<td>${v}</td>`;});
      table+='</tr>';
    });

    if(entry.images&&entry.images.length>0)body=entry.images.map(i=>`<img src="${i}" />`).join('')+body;
    detailBody.innerHTML=body;
  }
  detailTags.innerHTML=entry.tags?entry.tags.map(t=>`<span>#${t}</span>`).join(''):'无标签';

async function refreshData(){
  allEntries=await dbGetAll();
  let needSave=false;
  allEntries.forEach(e=>{
    if(!e.type){e.type='knowledge';needSave=true;}
    if(e.type==='case'&&!e.caseData){e.caseData={chiefComplaint:'',inquiry:'',examination:'',diagnosisThinking:'',referenceAnswer:'',extraFields:[]};needSave=true;}
    if(e.type==='knowledge'&&e.caseData){delete e.caseData;needSave=true;}
  });
  if(needSave){for(let e of allEntries)await dbUpdate(e);}
  render();
  // 数据发生变化 → 触发自动保存到文件
  scheduleAutoSave();
}
